[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bluerange"
version = "0.1.0"
description = "An open benchmark for safe autonomous cyber defence"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
dependencies = ["anthropic>=0.68,<1", "pydantic>=2.9,<3", "typer>=0.12,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.8", "mypy>=1.13", "types-PyYAML>=6"]

[project.scripts]
bluerange = "bluerange.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["bluerange"]
exclude = ["scenarios/identity_compromise/ground_truth.protected.yaml"]

[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "scenarios"
"NOTICE" = "NOTICE"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D107", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
